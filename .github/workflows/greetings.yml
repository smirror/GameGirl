name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v3
      with:
        issue_message: |
          Thanks **#** first issue, plz wait for owner comments
        pr_message: |
          Thanks **#** first pull request, plz wait for owner comments
