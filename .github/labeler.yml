# 'docs' フォルダ内またはそのサブフォルダ内の変更に 'Documentation' ラベルを追加
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'

# Cargo系ファイルに変更があった場合、'dependencies' ラベルを追加
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Cargo.toml"
          - "**/Cargo.lock"

# 'src' フォルダ内またはそのサブフォルダ内の変更に 'enhancement' ラベルを追加
enhancement:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/*.rs"
          - ".github/**/*.yml"
  - head-branch: [ '^feature', 'feature' ]

